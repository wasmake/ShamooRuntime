      - slot: 12
        material: YELLOW_DYE
        amount: 1
        name: '<italic:false><#FFD166><bold>◆ Ver al personal</bold></#FFD166>'
        lore:
          - '<italic:false><#A8B3C7>Muestra únicamente al equipo autorizado.</#A8B3C7>'
          - '<italic:false><#303746>▸</#303746> <#FFD166>Clic para aplicar</#FFD166>'
