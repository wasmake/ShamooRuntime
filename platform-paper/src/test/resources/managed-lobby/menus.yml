      - slot: 14
        material: GRAY_DYE
        amount: 1
        name: '<italic:false><#A8B3C7><bold>◆ Ocultar jugadores</bold></#A8B3C7>'
        lore:
          - '<italic:false><#A8B3C7>Oculta a los demás jugadores del lobby.</#A8B3C7>'
          - '<italic:false><#303746>▸</#303746> <#F8FAFC>Clic para aplicar</#F8FAFC>'
