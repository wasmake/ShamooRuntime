name: Release candidate

on:
  push:
    tags: ['v*-rc.*']

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require a canonical release-candidate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  full-ci:
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        task:
          - build :runtime-codegen-support:diffPlatformApis :runtime-codegen-support:verifyPaperApiCoverage :runtime-codegen-support:verifyVelocityApiCoverage
          - paperProcessIntegration
          - velocityProcessIntegration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/wrapper-validation@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Run required verification
        env:
          VERSION: ${{ github.ref_name }}
        run: ./gradlew ${{ matrix.task }} -PprojectVersion="${VERSION#v}" --no-daemon --stacktrace --warning-mode all
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-reports-${{ strategy.job-index }}
          path: |
            **/build/reports/**
            integration-*/build/runtime-server/work/**/*.log
          if-no-files-found: ignore

  package:
    needs: full-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build reproducible platform JARs
        env:
          VERSION: ${{ github.ref_name }}
        run: ./gradlew clean :bootstrap-paper:reobfJar :bootstrap-velocity:jar -PprojectVersion="${VERSION#v}" --no-daemon --stacktrace
      - name: Verify project, descriptor, manifest, and artifact versions
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          expected="${VERSION#v}"
          [[ "$(./gradlew -q properties -PprojectVersion="$expected" --no-daemon | awk '/^version:/ { print $2; exit }')" == "$expected" ]]
          paper=(bootstrap-paper/build/libs/bootstrap-paper-"$expected"-reobf.jar)
          velocity=(bootstrap-velocity/build/libs/shamoo-runtime-velocity-"$expected".jar)
          [[ -f "${paper[0]}" && -f "${velocity[0]}" ]]
          [[ "$(unzip -p "${paper[0]}" META-INF/MANIFEST.MF | tr -d '\r' | awk -F': ' '/^Implementation-Version:/ { print $2 }')" == "$expected" ]]
          [[ "$(unzip -p "${velocity[0]}" META-INF/MANIFEST.MF | tr -d '\r' | awk -F': ' '/^Implementation-Version:/ { print $2 }')" == "$expected" ]]
          unzip -p "${paper[0]}" plugin.yml | grep -Fx "version: '$expected'"
          unzip -p "${velocity[0]}" velocity-plugin.json | grep -F "\"version\":\"$expected\""
      - name: Stage separate Paper and Velocity candidates
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release-candidate
          paper_jars=(bootstrap-paper/build/libs/*-reobf.jar)
          velocity_jars=(bootstrap-velocity/build/libs/shamoo-runtime-velocity-*.jar)
          [[ ${#paper_jars[@]} -eq 1 && -f "${paper_jars[0]}" ]]
          [[ ${#velocity_jars[@]} -eq 1 && -f "${velocity_jars[0]}" ]]
          install -m 0644 "${paper_jars[0]}" "release-candidate/shamoo-runtime-paper-${VERSION#v}.jar"
          install -m 0644 "${velocity_jars[0]}" "release-candidate/shamoo-runtime-velocity-${VERSION#v}.jar"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: release-candidate
          format: spdx-json
          output-file: release-candidate/shamoo-runtime.spdx.json
          upload-artifact: false
      - name: Generate release-candidate checksums
        working-directory: release-candidate
        run: sha256sum ./*.jar ./*.spdx.json > SHA256SUMS
      - name: Attest release-candidate provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            release-candidate/*.jar
            release-candidate/*.spdx.json
            release-candidate/SHA256SUMS
      - name: Attest SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-path: release-candidate/*.jar
          sbom-path: release-candidate/shamoo-runtime.spdx.json
      - name: Retain release candidate as an Actions artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shamoo-runtime-${{ github.ref_name }}
          path: release-candidate/
          if-no-files-found: error
          retention-days: 30

  publish-release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download retained release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: shamoo-runtime-${{ github.ref_name }}
          path: release-candidate
      - name: Publish GitHub prerelease
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          assets=(
            "release-candidate/shamoo-runtime-paper-$version.jar"
            "release-candidate/shamoo-runtime-velocity-$version.jar"
            "release-candidate/shamoo-runtime.spdx.json"
            "release-candidate/SHA256SUMS"
          )
          for asset in "${assets[@]}"; do
            [[ -f "$asset" ]]
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists; release candidates are immutable.\n' "$TAG" >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "ShamooRuntime $TAG" \
            --notes "Attested ShamooRuntime release candidate. Verify SHA256SUMS and GitHub attestations before installation."
